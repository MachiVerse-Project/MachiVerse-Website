name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate public root
        shell: bash
        run: |
          set -euo pipefail
          test -f www/index.html
          test -f www/404.html
          test -f www/CNAME
          test -f www/robots.txt
          test -f www/sitemap.xml
          test -f www/.nojekyll

          if find www -type f -name '*.md' -print -quit | grep -q .; then
            echo 'Markdown files must not be placed in www/.' >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./www

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
