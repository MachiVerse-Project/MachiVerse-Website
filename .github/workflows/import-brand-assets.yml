name: Import official brand assets

on:
  push:
    paths:
      - .github/workflows/import-brand-assets.yml

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Import official assets from MachiVerse promotion branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/brand assets/images/icons assets/images/social

          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/MachiVerse-Project/MachiVerse/promotion/assets/images/brand/MachiVerse_Official_Logo_Primary.png' \
            --output assets/images/brand/logo-primary.png

          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/MachiVerse-Project/MachiVerse/promotion/assets/images/brand/MachiVerse_Official_Logo_Primary_Symbol.png' \
            --output assets/images/brand/logo-symbol.png

          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/MachiVerse-Project/MachiVerse/promotion/assets/images/icons/Icon%20(Resize%20tin).png' \
            --output assets/images/icons/favicon.png

          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/MachiVerse-Project/MachiVerse/promotion/assets/images/social-preview/Social%20preview%20(Cut%20and%20resize%2C%20comp).png' \
            --output assets/images/social/og-image.png

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
            exit 0
          fi
          git commit -m 'chore: import official brand assets'
          git push origin HEAD:main
